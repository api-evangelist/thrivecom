name: RingCaptcha (ThriveCom)
description: >-
  RingCaptcha, operated by ThriveCom, is a phone-verification and two-factor
  authentication (2FA) platform that helps businesses confirm real users and
  block fraud. It delivers one-time passcodes over SMS, voice, WhatsApp and
  missed-call (Blink) verification, normalizes and validates phone numbers to
  E.164, and returns fraud, carrier and device metadata to filter fake signups,
  bots and spam leads. Developers integrate through a simple form-encoded REST
  API at api.ringcaptcha.com, authenticated with per-application api_key,
  secret_key and app_key credentials, plus official client SDKs for Node.js,
  Python, PHP, Ruby, C#, Android, iOS and WordPress. RingCaptcha was surfaced
  as a 500 Global portfolio company and profiled through the API Evangelist
  enrichment pipeline.
